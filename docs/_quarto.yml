format:
  html:
    # The `embed` shortcode links each embedded notebook to a rendered preview
    # of its source. Quarto never builds those previews, because the notebooks
    # live in `notebooks/_ipynb/` and a leading underscore keeps a directory out
    # of the site, so every one of the links 404s. Publishing the previews would
    # add twenty pages that duplicate what the embed already shows on the page
    # the reader is on.
    notebook-links: false
    theme:
      light:
        - cosmo
        - styles.scss
      dark:
        - cosmo
        - styles-dark.scss
    toc: true
    toc-depth: 3
    toc-expand: 2
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    link-external-icon: true
    smooth-scroll: true
    anchor-sections: true
    grid:
      sidebar-width: 320px
      body-width: 920px
