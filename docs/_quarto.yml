project:
  type: website
  output-dir: _site
  pre-render:
    # Refreshes notebooks/_ipynb/ from ../notebooks/. Without it the embed
    # copies go stale (or missing) and every notebook page fails to build.
    - _sync_notebooks.py
    # Rewrites reference/api/*.qmd from the source of SciGraphs/api/. Reads it
    # with ast rather than importing it, so this costs no Blender and runs on
    # every build: the signatures on the site are the signatures in the tree.
    - ../scripts/docs/write_api_reference.py
  post-render:
    # Quarto stamps the build machine's absolute path into every embedded
    # notebook's wrapper div, and offers no option to stop it. This makes those
    # relative and fails the build if any absolute path survives.
    - _scrub_paths.py
  resources:
    # Served so an editor's $schema key and a model's constrained decoding can
    # both point at a URL rather than a copy.
    - reference/pipeline.schema.json

