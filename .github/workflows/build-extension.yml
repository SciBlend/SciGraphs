name: Build SciGraphs Extension

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths:
      - 'blender_manifest.toml'
      - 'SciGraphs/**'
      - 'core/**'
      - 'engine/**'
      - 'constraints/**'
      - 'scripts/**'
      - '.github/workflows/build-extension.yml'
  pull_request:
    branches: [ main, master ]

jobs:
  build-all-platforms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch platform wheels
        env:
          # The artifacts of this workflow are what gets uploaded to the
          # extensions platform, and the platform re-downloads every declared
          # wheel and compares its SHA256. A wheel rebuilt from the tree hashes
          # differently and is flagged as suspicious, so a release build takes
          # scigraphs-core and scigraphs-engine from PyPI at the exact version
          # pyproject.toml names. Local builds leave this unset and keep
          # rebuilding, so working on core/ or engine/ needs no PyPI round trip.
          SCIGRAPHS_RELEASE: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/fetch_wheels.sh
          ./scripts/fetch_wheels.sh
          
          echo "Downloaded wheels:"
          ls -lh wheels/*.whl | wc -l
          echo "Sample wheels:"
          ls wheels/*.whl | head -10

      - name: Download Blender
        run: |
          set -euo pipefail
          # Matches blender_version_min, so `extension build` and `extension
          # validate` here behave the way the platform's own checks will.
          BLENDER_VERSION=5.2.0
          BASE_URL=https://download.blender.org/release/Blender${BLENDER_VERSION%.*}
          FILE=blender-${BLENDER_VERSION}-linux-x64.tar.xz
          curl -L -o "$RUNNER_TEMP/$FILE" "$BASE_URL/$FILE"
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/$FILE"
          echo "BLENDER_BIN=$(find "$RUNNER_TEMP" -type f -name blender -path '*linux-x64/*' | head -n1)" >> "$GITHUB_ENV"

      # Two variants of the same extension, same id, same version, same code.
      # They differ only in whether scigraphs-utils is bundled, since it carries
      # Graphviz under the EPL, which cannot be combined with Blender's GPL, so
      # the zips destined for extensions.blender.org leave it out.
      - name: Build extension (full, for GitHub releases)
        run: |
          set -euo pipefail
          chmod +x build_extension.sh
          # build_extension.sh assembles a clean build dir with the add-on code
          # (SciGraphs/* contents) next to the manifest, so the __init__.py ends
          # up at the extension root. --no-install just builds the per-platform
          # zips without trying to install into a local Blender.
          ./build_extension.sh --no-install
          ls -lh dist

      - name: Build extension (platform, for extensions.blender.org)
        run: |
          set -euo pipefail
          ./build_extension.sh --no-install --no-graphviz
          ls -lh dist-platform

      - name: Validate both variants and check the split
        run: |
          set -euo pipefail
          status=0

          for zip in dist/*.zip dist-platform/*.zip; do
            echo "== $zip"
            env -u LD_LIBRARY_PATH "$BLENDER_BIN" --command extension validate "$zip" || status=1
          done

          # A platform zip that still carries Graphviz would be rejected, and a
          # full zip that lost it would silently ship without the layouts.
          for zip in dist-platform/*.zip; do
            listing=$(unzip -l "$zip")
            manifest=$(unzip -p "$zip" blender_manifest.toml)
            if grep -q scigraphs_utils <<<"$listing"; then
              echo "FAIL: $zip still bundles scigraphs-utils"; status=1
            fi
            if grep -qi graphviz <<<"$manifest"; then
              echo "FAIL: $zip manifest still references Graphviz"; status=1
            fi
          done
          for zip in dist/*.zip; do
            listing=$(unzip -l "$zip")
            if ! grep -q scigraphs_utils <<<"$listing"; then
              echo "FAIL: $zip is missing scigraphs-utils"; status=1
            fi
          done

          # Every wheel the manifest names must actually be in the zip, and
          # nothing else may be: an unreferenced wheel is flagged on review.
          for zip in dist/*.zip dist-platform/*.zip; do
            declared=$(unzip -p "$zip" blender_manifest.toml \
              | sed -n '/^\[build.generated\]/,$p' \
              | grep -oP '\./wheels/\K[^"]+\.whl' | sort)
            present=$(unzip -l "$zip" | grep -oP 'wheels/\K[^ ]+\.whl' | sort)
            if [ "$declared" != "$present" ]; then
              echo "FAIL: $zip declares wheels it does not ship, or ships extras"
              diff <(echo "$declared") <(echo "$present") || true
              status=1
            fi
          done

          exit $status

      - name: Upload artifact (full, linux-x64)
        uses: actions/upload-artifact@v4
        with:
          name: scigraphs-full-linux-x64
          path: dist/*linux*.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload artifact (full, windows-x64)
        uses: actions/upload-artifact@v4
        with:
          name: scigraphs-full-windows-x64
          path: dist/*windows*.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload artifact (full, macos-arm64)
        uses: actions/upload-artifact@v4
        with:
          name: scigraphs-full-macos-arm64
          path: dist/*macos_arm64*.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload artifact (platform, linux-x64)
        uses: actions/upload-artifact@v4
        with:
          name: scigraphs-platform-linux-x64
          path: dist-platform/*linux*.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload artifact (platform, windows-x64)
        uses: actions/upload-artifact@v4
        with:
          name: scigraphs-platform-windows-x64
          path: dist-platform/*windows*.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload artifact (platform, macos-arm64)
        uses: actions/upload-artifact@v4
        with:
          name: scigraphs-platform-macos-arm64
          path: dist-platform/*macos_arm64*.zip
          compression-level: 0
          if-no-files-found: error

